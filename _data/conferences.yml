# Security conferences in/near Austin. Last verified: 2026-10-20
# BSides Austin omitted: bsidesaustin.com says the event is on hold.
#
# Each edition becomes a calendar entry (see _plugins/conference_calendar.rb).
#   start / end    YYYY-MM-DD, quoted; end defaults to start
#   start_time     24h local Austin time, optional; end_time may be "00:00" for midnight
#   url            edition-specific link (tickets/registration); falls back to the conference url
#   note           optional extra detail shown in the event dialog
# Conferences with no upcoming edition show as "dates not yet announced".
- name: LASCON
  url: https://lascon.org/
  typical_month: October
  description: "Lonestar Application Security Conference, run by OWASP Austin, with training days beforehand."
  editions:
    - start: "2026-10-29"
      end: "2026-10-30"
      start_time: "08:00"
      end_time: "17:00"
      venue: Norris Conference Centers
      address: "2525 W Anderson Ln, Suite 365, Austin, TX 78757"
      url: https://lascon.org/tickets/
      note: "Training days run Oct 27–28, 8 AM–5 PM, with separate tickets."

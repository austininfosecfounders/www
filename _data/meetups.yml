# Recurring Austin security meetups. Last verified: 2026-10-20
- name: Austin Hackers Anonymous (AHA!)
  url: https://takeonme.org/
  cadence: Monthly
  description: "Long-running hacker meetup of short 5-10 minute talks; everyone is expected to present eventually."
- name: DC512 (DEF CON 512)
  url: https://www.meetup.com/defcon512/
  cadence: "Monthly, first Monday evening"
  description: "Austin DEF CON group; lightning firetalks with an offensive-security lean."
- name: OWASP Austin Chapter
  url: https://www.meetup.com/owasp-austin-chapter/
  cadence: "Monthly lunch, last Tuesday"
  description: "AppSec talks; the chapter also runs LASCON."
- name: Austin ISSA (Capitol of Texas Chapter)
  url: https://www.austinissa.org/
  cadence: "Quarterly meetings plus socials"
  description: "Information security professional association; runs the InnoTech security track."
- name: ISACA Austin Chapter
  url: https://engage.isaca.org/austinchapter/home
  cadence: "Monthly virtual, quarterly in person"
  description: "Audit, governance and risk community with CPE-focused events."
- name: ISC2 Austin Chapter
  url: https://isc2-austin-chapter.org/
  cadence: "Monthly, Wednesday evenings"
  description: "Official ISC2 chapter; talks for CISSPs and other certification holders."
- name: Cloud Security Alliance Austin / ATX Cyber Alliance
  url: https://www.meetup.com/atx-cyber-alliance/
  cadence: "Monthly happy hour, last Thursday"
  description: "Cloud security networking."
- name: CYBERLUNCH
  url: https://www.meetup.com/cyberlunch/
  cadence: "Monthly, second Friday noon, Round Rock"
  description: "Casual practitioner lunch: no slides, no sales pitches."
- name: AI Security Engineers - Austin
  url: https://www.meetup.com/ai-security-engineers-austin-tx/
  cadence: "Every 1-3 months"
  description: "Securing AI systems and LLM/agent risks."
- name: WiCyS Austin Affiliate
  url: https://sites.google.com/wicys.org/wicysaustin/home
  cadence: "Periodic socials, panels and workshops"
  description: "Women in CyberSecurity affiliate for Austin and Central Texas."
